name: Deploy GitHub Pages & Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Automated Verification Test (Assert HTTP 200)
        run: |
          echo "Verifying live deployment at: ${{ steps.deployment.outputs.page_url }}"
          URL="${{ steps.deployment.outputs.page_url }}"
          
          # Poll URL up to 10 times to verify availability
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i: HTTP Status = $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Verification Passed: Website is live and returning HTTP 200 OK!"
              exit 0
            fi
            sleep 5
          done

          echo "❌ Verification Failed: Site did not return HTTP 200 within timeout."
          exit 1
